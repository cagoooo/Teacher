# This file was auto-generated by the Firebase CLI and enhanced for secret injection
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 取出程式碼 📦
        uses: actions/checkout@v4

      - name: 設定 Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安裝相依套件 📥
        run: npm ci

      - name: 建置專案 🏗️
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: "__FIREBASE_API_KEY__"
          VITE_FIREBASE_AUTH_DOMAIN: "__FIREBASE_AUTH_DOMAIN__"
          VITE_FIREBASE_PROJECT_ID: "__FIREBASE_PROJECT_ID__"
          VITE_FIREBASE_STORAGE_BUCKET: "__FIREBASE_STORAGE_BUCKET__"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "__FIREBASE_MESSAGING_SENDER_ID__"
          VITE_FIREBASE_APP_ID: "__FIREBASE_APP_ID__"

      - name: 注入機密設定 💉
        run: python .github/inject.py
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: 部署到 Firebase Hosting 🚀
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TEACHER_C571B }}
          channelId: live
          projectId: teacher-c571b
